<<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دارم فرید دوست</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: url('IMG_20251206_100526_347.jpg') center/cover no-repeat fixed;
      display: grid;
      place-items: center;
      font-family: Tahoma, sans-serif;
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(1px);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
    }

    .safe-area {
      padding: 1rem;
      width: min(95vw, 900px);
      margin: auto;
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      outline: 1px solid rgba(255,255,255,0.12);
    }

    .title {
      font-weight: 700;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      margin: 0 0 1rem;
      line-height: 1.3;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }

    .text {
      font-size: clamp(1.2rem, 3.2vw, 1.6rem);
      line-height: 1.8;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>
  <main class="content">
    <div class="safe-area">
      <h1 class="title">فرید دوست دارم</h1>
      <p class="text">سلام مارو به برادر خانومت برسون</p>
    </div>
  </main>
</body>
</html>
